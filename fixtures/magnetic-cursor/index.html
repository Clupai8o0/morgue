<meta charset="utf-8" />
<title>Magnetic cursor button</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0b0b0d; color: #f2f2f0; height: 100vh; display: grid; place-items: center;
         font: 400 16px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; }
  .stage { display: grid; place-items: center; gap: 3rem; }
  .magnetic { position: relative; width: 220px; height: 220px; display: grid; place-items: center; }
  .disc { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); }
  .fill { position: absolute; inset: 0; border-radius: 50%; background: #f2f2f0; transform: scale(0); }
  .label { position: relative; font-size: 13px; letter-spacing: .28em; text-transform: uppercase; mix-blend-mode: difference; }
  .hint { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; opacity: .3; }
</style>

<div class="stage">
  <div class="magnetic" id="btn">
    <div class="disc"></div>
    <div class="fill"></div>
    <div class="label">Hover me</div>
  </div>
  <div class="hint">magnetic + fill</div>
</div>

<script src="/vendor/gsap.min.js"></script>
<script>
  const btn = document.getElementById('btn');
  const fill = btn.querySelector('.fill');
  const label = btn.querySelector('.label');

  const xTo = gsap.quickTo(btn, 'x', { duration: 0.8, ease: 'elastic.out(1, 0.4)' });
  const yTo = gsap.quickTo(btn, 'y', { duration: 0.8, ease: 'elastic.out(1, 0.4)' });

  btn.addEventListener('pointermove', (e) => {
    const r = btn.getBoundingClientRect();
    xTo((e.clientX - (r.left + r.width / 2)) * 0.5);
    yTo((e.clientY - (r.top + r.height / 2)) * 0.5);
  });

  btn.addEventListener('pointerenter', () => {
    gsap.to(fill, { scale: 1, duration: 0.6, ease: 'power3.out' });
    gsap.to(label, { letterSpacing: '0.4em', duration: 0.6, ease: 'power3.out' });
  });

  btn.addEventListener('pointerleave', () => {
    xTo(0); yTo(0);
    gsap.to(fill, { scale: 0, duration: 0.5, ease: 'power3.in' });
    gsap.to(label, { letterSpacing: '0.28em', duration: 0.5, ease: 'power3.in' });
  });

  window.__ready = true;
</script>
