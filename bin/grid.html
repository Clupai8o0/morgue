<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Vault</title>
<style>
  :root { --bg:#0b0b0d; --fg:#f2f2f0; --dim:rgba(242,242,240,.45); --line:rgba(242,242,240,.12); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font:400 14px/1.5 -apple-system,system-ui,sans-serif; padding:32px; }
  header { display:flex; gap:16px; align-items:baseline; margin-bottom:8px; }
  h1 { font-size:13px; letter-spacing:.3em; text-transform:uppercase; font-weight:500; }
  .count { color:var(--dim); font-size:12px; }
  #q { width:100%; margin:20px 0 12px; background:transparent; border:0; border-bottom:1px solid var(--line);
       color:var(--fg); font:400 26px/1.3 inherit; padding:10px 0; letter-spacing:-.02em; }
  #q:focus { outline:0; border-bottom-color:var(--fg); }
  #q::placeholder { color:var(--dim); }
  .facets { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:28px; }
  .facet { font-size:11px; letter-spacing:.08em; padding:5px 10px; border:1px solid var(--line); border-radius:100px;
           color:var(--dim); cursor:pointer; background:none; font-family:inherit; }
  /* Archive chips lead the row and sit one step brighter than a tag, because
     they scope to a family rather than to a property. Declared BEFORE the
     pressed rule on purpose: equal specificity, so source order decides, and
     the pressed state must win or a selected archive renders fg-on-fg. */
  .facet.arc { color:var(--fg); border-color:rgba(242,242,240,.28); }
  .facet[aria-pressed="true"] { color:var(--bg); background:var(--fg); border-color:var(--fg); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; }
  .card { position:relative; display:block; text-decoration:none; color:inherit; }
  .frame { position:relative; aspect-ratio:16/10; overflow:hidden; border-radius:6px; background:#141418;
           border:1px solid var(--line); }
  .frame img, .frame video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .frame video { opacity:0; transition:opacity .25s; }
  .frame video[data-painted] { opacity:1; }
  .meta { display:flex; justify-content:space-between; gap:12px; margin-top:10px; align-items:baseline; }
  .title { font-size:13px; }
  .tags { color:var(--dim); font-size:11px; letter-spacing:.06em; text-align:right; }
  .badge { position:absolute; top:8px; right:8px; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
           padding:3px 7px; border-radius:3px; background:rgba(11,11,13,.72); backdrop-filter:blur(6px); color:var(--fg); }
  /* Same treatment as .badge, opposite corner — the family label is a LABEL,
     never a control; the archive chip above is the control. Static blur and no
     transition, like .badge: up to twelve videos may be decoding behind it. */
  .rel { position:absolute; top:8px; left:8px; max-width:62%; overflow:hidden; text-overflow:ellipsis;
         white-space:nowrap; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
         padding:3px 7px; border-radius:3px; background:rgba(11,11,13,.72); backdrop-filter:blur(6px); color:var(--fg); }
  .empty { color:var(--dim); padding:40px 0; }
</style>

<header><h1>Vault</h1><span class="count" id="count"></span></header>
<input id="q" placeholder="images trailing the cursor, sticky stacked cards…" autofocus />
<div class="facets" id="facets"></div>
<div class="grid" id="grid"></div>
<p class="empty" id="empty" hidden>Nothing matches.</p>

<script type="module">
const items = await (await fetch('items.json')).json()
const grid = document.getElementById('grid')
const active = new Set()

// Chrome caps media elements at 75 per frame (kMaxWebMediaPlayers) and pausing does NOT
// release the player. Without an LRU that actually unloads, sweeping the mouse across a
// few dozen tiles exhausts the pool and every later tile silently refuses to load.
const MAX_PLAYERS = 12
const loaded = []
function release(v) {
  v.pause(); v.removeAttribute('src'); v.load(); v.removeAttribute('data-painted')
}
function claim(v) {
  const i = loaded.indexOf(v); if (i > -1) loaded.splice(i, 1)
  loaded.push(v)
  while (loaded.length > MAX_PLAYERS) release(loaded.shift())
}

// Assign src while the card is still offscreen-ish so the first hover isn't dead for
// 300ms. preload="metadata" costs a few KB per tile, not the whole clip.
const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    const v = e.target.querySelector('video')
    if (!v || !v.dataset.src) continue
    if (e.isIntersecting && !v.getAttribute('src')) { v.src = v.dataset.src; claim(v) }
  }
}, { rootMargin: '300px' })

const tagsOf = (it) => [...(it.effect ?? []), ...(it.technique ?? []), it.trigger, it.surface].filter(Boolean)

// Mirrors relationLabel() in web/src/lib/types.ts. Two copies on purpose: this
// file has no build step and cannot import TypeScript — the same trade-off the
// player LRU above already makes with lib/player-pool.ts. Keep them in step; a
// divergence shows up as two different badge texts for the same item.
// Guarded throughout: a stale items.json predating relations is a real state.
const relOf = (it) => {
  const r = it.relations
  if (!r || !r.archive) return ''
  if (r.role === 'template') {
    const n = (r.children ?? []).length
    return n ? `${n} extract${n === 1 ? '' : 's'}` : 'template'
  }
  if (r.role === 'extract') return `part of ${r.archive}`
  return ''
}

// tagsOf stays the DISPLAY list; keysOf is what the filter matches. The
// namespaced archive key rides the existing `active` Set rather than growing a
// second filtering system — and must never leak into .tags on a card.
const keysOf = (it) => (it.relations?.archive ? [...tagsOf(it), `archive:${it.relations.archive}`] : tagsOf(it))

function card(it) {
  const a = document.createElement('a')
  a.className = 'card'; a.href = it.href; a.target = '_blank'; a.rel = 'noopener'
  const rel = relOf(it)
  a.innerHTML = `
    <div class="frame">
      <img src="${it.poster}" alt="" loading="lazy" decoding="async" />
      ${it.video ? `<video muted loop playsinline preload="metadata" data-src="${it.video}"></video>` : ''}
      ${rel ? `<span class="rel">${rel}</span>` : ''}
      <span class="badge">${it.weight}</span>
    </div>
    <div class="meta">
      <span class="title">${it.title}</span>
      <span class="tags">${tagsOf(it).slice(0, 3).join(' · ')}</span>
    </div>`
  const v = a.querySelector('video')
  if (v) {
    v.addEventListener('playing', () => v.setAttribute('data-painted', ''), { once: false })
    // mouseenter, not pointerenter: pointerenter fires on touch too, so every tile would
    // start loading video during a tap-scroll on an iPad.
    a.addEventListener('mouseenter', () => {
      if (!v.getAttribute('src')) v.src = v.dataset.src
      claim(v); v.currentTime = 0; v.play().catch(() => {})
    })
    a.addEventListener('mouseleave', () => { v.pause(); v.removeAttribute('data-painted') })
    io.observe(a)
  }
  return a
}

function render() {
  const q = document.getElementById('q').value.toLowerCase().trim()
  const shown = items.filter((it) => {
    if (active.size && !keysOf(it).some((t) => active.has(t))) return false
    if (!q) return true
    // The archive name is in the haystack too, so typing "blunt" finds the
    // whole family whether or not the chip is on.
    return (it.title + ' ' + tagsOf(it).join(' ') + ' ' + (it.relations?.archive ?? '') + ' ' + (it.notes ?? ''))
      .toLowerCase().includes(q)
  })
  loaded.splice(0).forEach(release)
  grid.replaceChildren(...shown.map(card))
  document.getElementById('empty').hidden = shown.length > 0
  document.getElementById('count').textContent = `${shown.length} of ${items.length}`
}

// Derived from `items`, never from the filtered result: an active filter must
// never remove its own escape hatch. Archives lead, so a family is one click
// from the top of the row.
const allArchives = [...new Set(items.map((it) => it.relations?.archive).filter(Boolean))].sort()
  .map((a) => `archive:${a}`)
const allTags = [...new Set(items.flatMap(tagsOf))].sort()
document.getElementById('facets').replaceChildren(...[...allArchives, ...allTags].map((t) => {
  const b = document.createElement('button')
  const isArc = t.startsWith('archive:')
  b.className = isArc ? 'facet arc' : 'facet'
  // Labelled without the namespace, keyed with it: the prefix exists to keep
  // an archive called "scroll" from colliding with the tag "scroll".
  b.textContent = isArc ? t.slice('archive:'.length) : t
  b.setAttribute('aria-pressed', 'false')
  b.onclick = () => {
    active.has(t) ? active.delete(t) : active.add(t)
    b.setAttribute('aria-pressed', String(active.has(t)))
    render()
  }
  return b
}))

document.getElementById('q').addEventListener('input', render)
render()
</script>
